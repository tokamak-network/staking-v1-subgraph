type SeigGiven2 @entity(immutable: true) {
  id: ID!
  layer2: Bytes! # address
  totalSeig: BigInt! # uint256
  stakedSeig: BigInt! # uint256
  unstakedSeig: BigInt! # uint256
  powertonSeig: BigInt! # uint256
  candidateAddOn: CandidateAddOn!
  pseig: BigInt! # uint256
  l2TotalSeigs: BigInt!
  layer2Seigs: BigInt!
  blockTimestamp: BigInt!
  transaction: Transaction!
}


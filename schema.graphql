type Factory @entity(immutable: false) {
  id: ID!
  totalStaked: BigInt!
  totalPendingWithdrawal: BigInt!
  numOfCandidate: BigInt!
}

type StakingDayData @entity(immutable: false) {
  id: ID!
  date: Int!
  totalStaked: BigInt!
}

type Candidate @entity(immutable: false) {
  # candidate index
  id: ID!
  candidate: Bytes!
  candidateContract: Bytes! # address
  name: String! # string
  #blockNumber: BigInt!
  #blockTimestamp: BigInt!
	#owner: Bytes!
  #coinage: Bytes!
	# staked amount of this candidate
	stakedAmount: BigInt!
  pendingWithdrawalAmount: BigInt!
  txCount: BigInt!
  commissionRate: BigInt!
  prevTotalSupply: BigInt!
  nextTotalSupply: BigInt!
  seigs: BigInt!
  candidateAddOn: CandidateAddOn
  # user info who are staking to this candidate
	stakedUserList: [UserStaked!]!
  # derived values
  staked: [Staked]! @derivedFrom(field: "candidate")
  unstaked: [Unstaked]! @derivedFrom(field: "candidate")
  restaked: [Restaked]! @derivedFrom(field: "candidate")
	withdrawal: [Withdrawal]! @derivedFrom(field: "candidate")
  addedSeig: [AddedSeigAtLayer]! @derivedFrom(field: "candidate")
  withdrawalAndDeposited: [WithdrawalAndDeposited]! @derivedFrom(field: "candidate")
}

type CandidateAddOn @entity(immutable: false) {
  id: ID!
  memo: String # string
  candidate: Candidate # address
  operator: Bytes
  candidateAddOn: Bytes # address
  wtonAmount: BigInt # uint256
  rollupConfig: Bytes # address
  bridge: Bytes
  stateRoot: Bytes
  txData: Bytes
  portal: Bytes
  registeredTime: BigInt
  txCount: BigDecimal
  seigGiven: [SeigGiven2]! @derivedFrom(field: "candidateAddOn")
}

type User @entity(immutable: false) {
	# user address
  id: ID!
	# deposited amount of this user
	totalStaked: BigInt!
  pendingWithdrawalAmount: BigInt!
	# amount of TON from seigniorage 
  candidate: Candidate!
	totalEarnedSeig: BigInt!
  #userStaked: [UserStaked!]
	# derived values
  staked: [Staked]! @derivedFrom(field: "user")
  unstaked: [Unstaked]! @derivedFrom(field: "user")
  restaked: [Restaked]! @derivedFrom(field: "user")
	withdrawal: [Withdrawal]! @derivedFrom(field: "user")
  withdrawalAndDeposited: [WithdrawalAndDeposited]! @derivedFrom(field: "user")
}

type UserStaked @entity(immutable: false) {
  id: ID!
  # user address
  user: User!
  # index of candidate
  stakeOf: BigInt!
  candidate: Candidate!
  stakedAmount: BigInt!
  pendingWithdrawalAmount: BigInt!
}

type Transaction @entity(immutable: false) {
  # txn hash
  id: ID!
  # block txn was included in
  blockNumber: BigInt!
  # timestamp txn was confirmed
  timestamp: BigInt!
  # gas used during txn execution
  gasUsed: BigInt
  gasPrice: BigInt!
  numEvent: BigInt!
  # derived values
  staked: [Staked]! @derivedFrom(field: "transaction")
  unstaked: [Unstaked]! @derivedFrom(field: "transaction")
  restaked: [Restaked]! @derivedFrom(field: "transaction")
	withdrawal: [Withdrawal]! @derivedFrom(field: "transaction")
  addedSeig: [AddedSeigAtLayer]! @derivedFrom(field: "transaction")
  changedMember: [ChangedMember]! @derivedFrom(field: "transaction")
  seigGiven2: [SeigGiven2]! @derivedFrom(field: "transaction")
  withdrawalAndDeposited: [WithdrawalAndDeposited]! @derivedFrom(field: "transaction")
}

type AddedSeigAtLayer @entity(immutable: true) {
  id: ID!
  candidate: Candidate!
  transaction: Transaction!
  timestamp: BigInt!
  layer2: Bytes! # address
  seigs: BigInt! # uint256
  operatorSeigs: BigInt! # uint256
  nextTotalSupply: BigInt! # uint256
  prevTotalSupply: BigInt! # uint256
  #blockNumber: BigInt!
  #blockTimestamp: BigInt!
  #transactionHash: Bytes!
}

type Member @entity(immutable: false) {
  id: ID!
  candidate: Candidate!
}

type ChangedMember @entity(immutable: true) {
  id: ID!
  transaction: Transaction!
  timestamp: BigInt!
  slotIndex: BigInt!
  prevMember: Bytes!
  newMember: Bytes!
}

type ChangedMemo @entity(immutable: true) {
  id: ID!
  transaction: Transaction!
  timestamp: BigInt!
  candidate: Bytes!
  name: String!
}


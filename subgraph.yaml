specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SeigManager
    network: sepolia
    source:
      address: "0x2320542ae933FbAdf8f5B97cA348c7CeDA90fAd7"
      abi: SeigManager
      startBlock: 4700000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CoinageCreated
        - AddedSeigAtLayer
        # - Comitted
        # - CommissionRateSet
        # - OnSnapshot
        # - Paused
        # - SeigGiven
        # - UpdatedSeigniorage
      abis:
        - name: SeigManager
          file: ./abis/SeigManager.json
      eventHandlers:
        - event: CoinageCreated(indexed address,address)
          handler: handleCoinageCreated
        - event: AddedSeigAtLayer(address,uint256,uint256,uint256,uint256)
          handler: handleAddedSeigAtLayer
        # - event: Comitted(indexed address)
        #   handler: handleComitted
        - event: CommissionRateSet(indexed address,uint256,uint256)
          handler: handlerCommissionRateSet
        # - event: OnSnapshot(uint256)
        #   handler: handleOnSnapshot
        - event: SeigGiven2(indexed address,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleSeigGiven
        # - event: UpdatedSeigniorage(indexed address,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
        #   handler: handleUpdatedSeigniorage
      file: ./src/mappings/seig-manager.ts
  - kind: ethereum
    name: DepositManager
    network: sepolia
    source:
      address: "0x90ffcc7F168DceDBEF1Cb6c6eB00cA73F922956F"
      abi: DepositManager
      startBlock: 4700000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deposited
        - WithdrawalProcessed
        - WithdrawalRequested
        - WithdrawalAndDeposited
      abis:
        - name: DepositManager
          file: ./abis/DepositManager.json
      eventHandlers:
        - event: Deposited(indexed address,address,uint256)
          handler: handleStaked
        - event: WithdrawalProcessed(indexed address,address,uint256)
          handler: handleWithdrawal
        - event: WithdrawalRequested(indexed address,address,uint256)
          handler: handleUnstaked
        - event: WithdrawalAndDeposited(indexed address,address,uint256)
          handler: handleWithdrawalAndDeposited
      file: ./src/mappings/deposit-manager.ts
  - kind: ethereum
    name: DAOCommittee
    network: sepolia
    source:
      address: "0xA2101482b28E3D99ff6ced517bA41EFf4971a386"
      abi: DAOCommittee
      startBlock: 4700000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        # - ActivityRewardChanged
        # - AgendaCreated
        # - AgendaExecuted
        # - AgendaVoteCasted
        - CandidateContractCreated
        - ChangedMember
        - ChangedMemo
        # - ChangedSlotMaximum
        # - ClaimedActivityReward
        # - Layer2Registered
      abis:
        - name: DAOCommittee
          file: ./abis/DAOCommittee.json
      eventHandlers:
        # - event: ActivityRewardChanged(uint256)
        #   handler: handleActivityRewardChanged
        # - event: AgendaCreated(indexed address,indexed uint256,address[],uint128,uint128,bool)
        #   handler: handleAgendaCreated
        # - event: AgendaExecuted(indexed uint256,address[])
        #   handler: handleAgendaExecuted
        # - event: AgendaVoteCasted(indexed address,indexed uint256,uint256,string)
        #   handler: handleAgendaVoteCasted
        - event: CandidateContractCreated(indexed address,indexed address,string)
          handler: handleCandidateContractCreated
        - event: ChangedMember(indexed uint256,address,indexed address)
          handler: handleChangedMember
        # - event: ChangedMemo(address,string)
        #   handler: handleChangedMemo
        # - event: ChangedSlotMaximum(indexed uint256,indexed uint256)
        #   handler: handleChangedSlotMaximum
        # - event: ClaimedActivityReward(indexed address,address,uint256)
        #   handler: handleClaimedActivityReward
        # - event: Layer2Registered(indexed address,indexed address,string)
        #   handler: handleLayer2Registered
      file: ./src/mappings/dao-committee.ts
  - kind: ethereum
    name: Layer2Manager
    network: sepolia
    source:
      address: "0x0fDb12aF5Fece558d17237E2D252EC5dbA25396b"
      abi: Layer2Manager
      startBlock: 5859621
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - RegisteredCandidateAddOn
        # - SetMinimumInitialDepositAmount
        # - SetAddresses
      abis:
        - name: Layer2Manager
          file: ./abis/Layer2Manager.json
        - name: Layer2Candidate
          file: ./abis/Layer2Candidate.json
        - name: SystemConfig
          file: ./abis/SystemConfig.json
      eventHandlers:
        - event: RegisteredCandidateAddOn(address,uint256,string,address,address)
          handler: handleRegisteredCandidateAddOn
        # - event: SetMinimumInitialDepositAmount(uint256)
        #   handler: handleSetMinimumInitialDepositAmount
        # - event: SetAddresses(address,address,address,address,address,address,address,address)
        #   handler: handleSetAddresses
      file: ./src/mappings/layer-2-manager.ts
  - kind: ethereum
    name: L1CrossDomainMessenger
    network: sepolia
    source:
      address: "0xc123047238e8f4bFB7Ad849cA4364b721B5ABD8A"
      abi: L1CrossDomainMessenger
      startBlock: 5614234
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - FailedRelayedFastMessage
        - FailedRelayedMessage
        - Initialized
        - MessageAllowed
        - MessageBlocked
        - OwnershipTransferred
        - Paused
        - RelayedFastMessage
        - RelayedMessage
        - SentMessage
        - Unpaused
      abis:
        - name: L1CrossDomainMessenger
          file: ./abis/L1CrossDomainMessenger.json
      eventHandlers:
        - event: FailedRelayedFastMessage(indexed address,address,bytes,uint256)
          handler: handleFailedRelayedFastMessage
        - event: FailedRelayedMessage(indexed bytes32)
          handler: handleFailedRelayedMessage
        - event: Initialized(uint8)
          handler: handleInitialized
        - event: MessageAllowed(indexed bytes32)
          handler: handleMessageAllowed
        - event: MessageBlocked(indexed bytes32)
          handler: handleMessageBlocked
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Paused(address)
          handler: handlePaused
        - event: RelayedFastMessage(indexed address,address,bytes,uint256)
          handler: handleRelayedFastMessage
        - event: RelayedMessage(indexed bytes32)
          handler: handleRelayedMessage
        - event: SentMessage(indexed address,address,bytes,uint256,uint256)
          handler: handleSentMessage
        - event: Unpaused(address)
          handler: handleUnpaused
      file: ./src/mappings/l1-cross-domain-messenger.ts
  - kind: ethereum
    name: L1StandardBridge
    network: sepolia
    source:
      address: "0x1F032B938125f9bE411801fb127785430E7b3971"
      abi: L1StandardBridge
      startBlock: 5614239
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ERC20DepositInitiated
        - ERC20WithdrawalFinalized
        - ETHDepositInitiated
        - ETHWithdrawalFinalized
      abis:
        - name: L1StandardBridge
          file: ./abis/L1StandardBridge.json
      eventHandlers:
        - event: ERC20DepositInitiated(indexed address,indexed address,indexed
            address,address,uint256,bytes)
          handler: handleERC20DepositInitiated
        - event:
            ERC20WithdrawalFinalized(indexed address,indexed address,indexed
            address,address,uint256,bytes)
          handler: handleERC20WithdrawalFinalized
        - event: ETHDepositInitiated(indexed address,indexed address,uint256,bytes)
          handler: handleETHDepositInitiated
        - event: ETHWithdrawalFinalized(indexed address,indexed address,uint256,bytes)
          handler: handleETHWithdrawalFinalized
      file: ./src/mappings/l1-standard-bridge.ts